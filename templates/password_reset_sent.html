{% extends "auth_base.html" %}

{% block title %}Check your email{% endblock %}

{% block auth_content %}

<div class="auth-pop-in mb-2 flex h-11 w-11 items-center justify-center rounded-xl bg-primary-soft/40 text-primary dark:bg-primary/10 dark:text-primary-soft">
  <i class="ph ph-envelope-simple text-[20px]"></i>
</div>

<h1 class="text-xl font-bold tracking-tight text-ink dark:text-ink-dark">Check your email</h1>
<p class="mt-1 text-sm text-muted dark:text-muted-dark">
  If an account exists for the email you entered, we've sent a link to reset your password. The link expires shortly, so use it soon.
</p>

<a href="{% url 'login' %}" class="mt-6 flex items-center justify-center gap-1.5 text-sm font-semibold text-primary transition-colors hover:underline dark:text-primary-soft">
  <i class="ph ph-arrow-left text-[14px]"></i> Back to log in
</a>

{% endblock %}
